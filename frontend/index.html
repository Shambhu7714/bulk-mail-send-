<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Mail Sender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📤 Bulk Mail Sender</h1>
    <p class="subtitle">Send personalized voucher emails via Excel or manual entry.</p>

    <div class="card">
      <h2>1️⃣ Email Template</h2>
      <p class="help-text">
        Use <code>&lt;&lt;Name&gt;&gt;</code> and <code>&lt;&lt;Amount&gt;&gt;</code> placeholders.
      </p>
      <textarea id="templateBox" class="textarea">
Dear &lt;&lt;Name&gt;&gt;,

Congratulations on winning an Amazon voucher worth ₹&lt;&lt;Amount&gt;&gt; in the AMBIT JAS’25 Bonanza Contest, as part of the Bajaj Finserv Health Family!

To receive your voucher code, simply click on the “I Confirm” button below. This will open a new email draft—just press Send, and your voucher code will be shared with you in the reply.

Enjoy your reward, and thank you once again for being a valued member of the Bajaj Finserv Health Family.

Best regards,
Team Bajaj Finserv Health
      </textarea>
    </div>

    <div class="card">
      <h2>2️⃣ Send via Excel Upload</h2>
      <p class="help-text">
        Excel must have columns: <b>Executive Name, Email, Voucher Amount</b>
      </p>

      <label class="label">Subject</label>
      <input type="text" id="excelSubject" class="input" placeholder="Email Subject">

      <label class="label">Excel File</label>
      <input type="file" id="excelFile" class="input">

      <button onclick="sendExcel()" class="button primary">Send Emails from Excel</button>
    </div>

    <div class="card">
      <h2>3️⃣ Send via Manual Entry</h2>
      <label class="label">Emails (comma separated)</label>
      <textarea id="manualEmails" class="textarea" placeholder="email1@example.com, email2@example.com"></textarea>

      <label class="label">Subject</label>
      <input type="text" id="manualSubject" class="input" placeholder="Email Subject">

      <label class="label">Name (for this batch)</label>
      <input type="text" id="manualName" class="input" placeholder="e.g. Rahul Sharma">

      <label class="label">Voucher Amount (for this batch)</label>
      <input type="text" id="manualAmount" class="input" placeholder="e.g. 500">

      <button onclick="sendManual()" class="button secondary">Send Manual Emails</button>
    </div>

    <div class="card">
      <h2>📋 Logs / Response</h2>
      <pre id="output" class="output"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
